name: doggycredit

# Stack completo del Sprint 1 (guía de inducción §3.4). Generar el realm antes
# de iniciar: `python scripts/generate_realm.py`.
#
# Entrada única: Caddy en HTTPS (443), sirve la SPA y enruta /auth (Keycloak)
# y /api/v1 (doggycredit-api). La API y Postgres nunca publican puerto al host.
# Grafana y el simulador del buró quedan expuestos solo para diagnóstico local.

x-logging: &dc-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DC_DB_NAME:-doggycredit}
      POSTGRES_USER: ${DC_DB_USER:-doggy_app}
      POSTGRES_PASSWORD: ${DC_DB_PASSWORD:?falta DC_DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *dc-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # --health-enabled=true (endpoint /health/ready oficial) provocó una
    # re-augmentación de Quarkus que se colgaba de forma reproducible en esta
    # máquina; se deja fuera y el healthcheck usa una conexión TCP simple.
    # La consola de administración se usa a través de Caddy: https://localhost/auth/admin
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC_KEYCLOAK_ADMIN_PASSWORD:?falta DC_KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      # Referencias ${DC_SEED_*} del realm generado desde seed/tenants.yaml.
      DC_SEED_ADMIN_PASSWORD: ${DC_SEED_ADMIN_PASSWORD:?falta DC_SEED_ADMIN_PASSWORD en .env}
      DC_SEED_ANALYST_PASSWORD: ${DC_SEED_ANALYST_PASSWORD:?falta DC_SEED_ANALYST_PASSWORD en .env}
      DC_SEED_ADMIN_PASSWORD_2: ${DC_SEED_ADMIN_PASSWORD_2:?falta DC_SEED_ADMIN_PASSWORD_2 en .env}
      DC_SEED_M2M_SECRET: ${DC_SEED_M2M_SECRET:?falta DC_SEED_M2M_SECRET en .env}
      DC_SEED_M2M_SECRET_2: ${DC_SEED_M2M_SECRET_2:?falta DC_SEED_M2M_SECRET_2 en .env}
    volumes:
      - ./keycloak/doggycredit-realm.json:/opt/keycloak/data/import/doggycredit-realm.json:ro
      # Tema de la pantalla de acceso con los colores del Design System.
      - ./keycloak/themes/doggycredit:/opt/keycloak/themes/doggycredit:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: *dc-logging

  wiremock-bureau:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ../simulators/wiremock/bureau:/home/wiremock
    ports:
      # para probar el conector desde fuera de Compose (mvn spring-boot:run).
      - "${DC_WIREMOCK_BUREAU_HOST_PORT:-8089}:8080"
    healthcheck:
      # La segunda petición (404 esperado, su resultado no cuenta) calienta el
      # motor de plantillas: medido, el primer 404 con plantilla tarda ~1,6 s,
      # más que el read-timeout de 1,5 s del conector, y el primer documento
      # desconocido de la demo se reportaba como "fuente caída".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1; wget -q -O /dev/null http://127.0.0.1:8080/bureau/v1/informe/CALENTAMIENTO; exit 0"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *dc-logging

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.5
    ports:
      # Grafana: trazas, métricas y logs por X-Correlation-Id (guía §10.5).
      - "${DC_GRAFANA_HOST_PORT:-3300}:3000"
    volumes:
      # D-08: panel «Modelos de scoring» (PSI), provisionado al arrancar.
      - ./grafana/doggycredit-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/doggycredit-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/doggycredit-dashboards:ro
    logging: *dc-logging

  doggycredit-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DC_DB_HOST: postgres
      DC_DB_NAME: ${DC_DB_NAME:-doggycredit}
      DC_DB_USER: ${DC_DB_USER:-doggy_app}
      DC_DB_PASSWORD: ${DC_DB_PASSWORD:?falta DC_DB_PASSWORD en .env}
      # El issuer es la URL pública (la que ve el navegador); las claves se
      # descargan por la red interna para no depender del certificado de Caddy.
      DC_KEYCLOAK_ISSUER_URI: ${DC_KEYCLOAK_ISSUER_URI:-https://localhost/auth/realms/doggycredit}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/doggycredit/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: doggycredit-api
      DC_INTEGRATION_BUREAU_URL: http://wiremock-bureau:8080
      # D-08: métricas (incluido el PSI del score) por OTLP a otel-lgtm → Grafana.
      DC_OTLP_METRICS_ENABLED: "true"
      DC_OTLP_METRICS_URL: http://otel-lgtm:4318/v1/metrics
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *dc-logging

  caddy:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${DC_HTTP_PORT:-443}:443"
    depends_on:
      doggycredit-api:
        condition: service_healthy
    volumes:
      # caddy_data conserva la CA local: se confía una sola vez (ver runbook).
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Puerto HTTPS escuchando. Vale igual en localhost (CA interna) y en la VM
      # (certificado público), donde https://localhost no tiene certificado.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *dc-logging

volumes:
  postgres_data:
  keycloak_data:
  caddy_data:
  caddy_config:
