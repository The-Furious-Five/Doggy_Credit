name: doggycredit

# Perfil `core` para el Día 1: Postgres + Keycloak + el simulador de buró +
# observabilidad. `doggycredit-api` se agrega cuando el backend compile
# (SPIKE-1/HAB-01 en adelante); Caddy y la SPA cuando exista `web/dist`.
#
# Solo Caddy publica un puerto público (RNF de la arquitectura, §9.4 y §10.4
# de la guía de inducción). Todo lo demás es red interna.

x-logging: &dc-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DC_DB_NAME:-doggycredit}
      POSTGRES_USER: ${DC_DB_USER:-doggy_app}
      POSTGRES_PASSWORD: ${DC_DB_PASSWORD:?falta DC_DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *dc-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # --health-enabled=true (endpoint /health/ready oficial) provocó una
    # re-augmentación de Quarkus que se colgaba de forma reproducible en esta
    # máquina; se deja fuera y el healthcheck usa una conexión TCP simple.
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DC_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DC_KEYCLOAK_ADMIN_PASSWORD:?falta DC_KEYCLOAK_ADMIN_PASSWORD en .env}
    ports:
      # el único puerto no-Caddy expuesto: consola de administración local del Día 1.
      # Se retira cuando Caddy enrute /auth/* (según avance SPIKE-2).
      - "${DC_KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: *dc-logging

  wiremock-bureau:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ../simulators/wiremock/bureau:/home/wiremock
    ports:
      # expuesto en el Día 1 para probar el conector desde fuera de Compose;
      # cuando el backend esté armado, se accede solo por la red interna.
      - "${DC_WIREMOCK_BUREAU_HOST_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *dc-logging

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.5
    ports:
      - "${DC_GRAFANA_HOST_PORT:-3300}:3000"
    logging: *dc-logging

volumes:
  postgres_data:
