spring:
  application:
    name: doggycredit-api

  datasource:
    url: jdbc:postgresql://${DC_DB_HOST:localhost}:${DC_DB_PORT:5432}/${DC_DB_NAME:doggycredit}
    username: ${DC_DB_USER:doggy_app}
    password: ${DC_DB_PASSWORD:doggy_app}

  jpa:
    open-in-view: false
    hibernate:
      # DEBT-015 pagada (V2026_09_29_1402): event_publication ya tiene su
      # propia migración escrita a mano. El esquema lo maneja solo Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  mvc:
    problemdetails:
      # RFC 9457 nativo de Spring (ErrorResponseException -> application/problem+json).
      # El manejador único con correlationId es RF-API-02.1.
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Varias ramas se mergearon a main después de desplegarse V2026_10_05_1530,
    # con migraciones de fecha anterior. Sin esto, Flyway rechaza el arranque en
    # el VPS ("Validate failed"). En una base nueva el orden es el mismo de siempre.
    # Aun así, las migraciones nuevas deben llevar fecha posterior a la última de main.
    out-of-order: true
    placeholders:
      appDbPassword: ${DC_APP_DB_PASSWORD:dev_only_app_role}

  # SPIKE-2 (Franco, con Nicole) fija el issuer real cuando el realm exista.
  # Sin esta propiedad configurada, el resource server no arranca: es
  # intencional (deny-by-default también en el arranque).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DC_KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/doggycredit}

server:
  port: 8080

doggycredit:
  datasource:
    url: jdbc:postgresql://${DC_DB_HOST:localhost}:${DC_DB_PORT:5432}/${DC_DB_NAME:doggycredit}
    username: ${DC_APP_DB_USER:doggycredit_app}
    password: ${DC_APP_DB_PASSWORD:dev_only_app_role}
    hikari:
      maximum-pool-size: 10
  correlation:
    header: ${DC_CORRELATION_HEADER:X-Correlation-Id}
  integration:
    # Conector del buró (RF-INT-02.1, contracts/connectors/bureau.v1.yaml). Sin modo local:
    # siempre HTTP. read-timeout muy por debajo del presupuesto de 2 s de la evaluación (HAB-04).
    bureau:
      url: ${DC_INTEGRATION_BUREAU_URL:http://localhost:8089}
      connect-timeout: ${DC_INTEGRATION_BUREAU_CONNECT_TIMEOUT:500ms}
      read-timeout: ${DC_INTEGRATION_BUREAU_READ_TIMEOUT:1500ms}
    # Core bancario (B-03, bank.v1.yaml) y billetera móvil (B-05, wallet.v1.yaml): mismos plazos.
    bank:
      url: ${DC_INTEGRATION_BANK_URL:http://localhost:8090}
      connect-timeout: ${DC_INTEGRATION_BANK_CONNECT_TIMEOUT:500ms}
      read-timeout: ${DC_INTEGRATION_BANK_READ_TIMEOUT:1500ms}
    wallet:
      url: ${DC_INTEGRATION_WALLET_URL:http://localhost:8091}
      connect-timeout: ${DC_INTEGRATION_WALLET_CONNECT_TIMEOUT:500ms}
      read-timeout: ${DC_INTEGRATION_WALLET_READ_TIMEOUT:1500ms}

  assessment:
    collection-budget: ${DC_ASSESSMENT_COLLECTION_BUDGET:2s}

  # D-02: versión del modelo avanzado (plan PRO). Carga models/scoring-<versión>.onnx
  # y su .params.json, que el CI verifica contra ml/model/ (D-07).
  scoring:
    model-version: ${DC_SCORING_MODEL_VERSION:v2}

  # A-07: solicitudes por minuto por tenant según su plan (informe, PL-05).
  # En memoria (DEBT-003): con una segunda réplica pasa a Redis.
  rate-limit:
    requests-per-minute:
      FREE: 30
      PRO: 300
      ENTERPRISE: 1000

  # D-06: tasa anual de referencia y plazo sugerido por necesidad, solo para
  # el monto sugerido (CA-04). El máximo y la tasa de cada producto los aplica
  # la recomendación (C-03). Productivas: tope del D.S. 2055/5403 para micro
  # (11,5 %, RN-17, por validar); consumo: tasa de referencia de mercado.
  needs:
    reference-annual-rate:
      CAPITAL_TRABAJO: 0.115
      INVERSION_PRODUCTIVA: 0.115
      EFICIENCIA_ENERGETICA: 0.115
      CONSUMO_CONSOLIDACION: 0.18
    default-term-months:
      CAPITAL_TRABAJO: 12
      INVERSION_PRODUCTIVA: 36
      EFICIENCIA_ENERGETICA: 36
      CONSUMO_CONSOLIDACION: 24

  # D-08: deriva semanal del score (PSI). Sin al menos min-sample evaluaciones
  # en la semana y en la línea base, el resultado es INSUFICIENTE.
  analytics:
    drift:
      cron: ${DC_ANALYTICS_DRIFT_CRON:0 0 3 * * MON}
      min-sample: 30

  encryption:
    master-key: ${DC_MASTER_KEY:dev-only-insecure-master-key-do-not-use-in-prod}

  # D-09: administración de clientes de Keycloak para las claves de API.
  # base-url es la red interna; public-issuer-uri, lo que ve el integrador.
  keycloak:
    admin:
      base-url: ${DC_KEYCLOAK_ADMIN_URL:http://localhost:8081/auth}
      realm: doggycredit
      client-id: doggycredit-api-admin
      client-secret: ${DC_KEYCLOAK_API_ADMIN_SECRET:}
      public-issuer-uri: ${DC_KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/doggycredit}
      timeout: 3s

management:
  # D-08: métricas por OTLP al colector de otel-lgtm. Apagado por defecto (pruebas,
  # mvn spring-boot:run); Compose lo enciende con DC_OTLP_METRICS_ENABLED.
  otlp:
    metrics:
      export:
        enabled: ${DC_OTLP_METRICS_ENABLED:false}
        url: ${DC_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 1m
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  pattern:
    # el id de correlación (RF-API-02.1) se agrega al MDC como "correlationId"
    level: "%5p [%X{correlationId:-}]"
