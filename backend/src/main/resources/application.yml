spring:
  application:
    name: doggycredit-api

  datasource:
    url: jdbc:postgresql://${DC_DB_HOST:localhost}:${DC_DB_PORT:5432}/${DC_DB_NAME:doggycredit}
    username: ${DC_DB_USER:doggy_app}
    password: ${DC_DB_PASSWORD:doggy_app}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # DEBT-015 pagada (V2026_09_29_1402): event_publication ya tiene su
      # propia migración escrita a mano. El esquema lo maneja solo Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  mvc:
    problemdetails:
      # RFC 9457 nativo de Spring (ErrorResponseException -> application/problem+json).
      # El manejador único con correlationId es RF-API-02.1.
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # SPIKE-2 (Franco, con Nicole) fija el issuer real cuando el realm exista.
  # Sin esta propiedad configurada, el resource server no arranca: es
  # intencional (deny-by-default también en el arranque).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DC_KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/doggycredit}

server:
  port: 8080

doggycredit:
  correlation:
    header: ${DC_CORRELATION_HEADER:X-Correlation-Id}
  integration:
    # Conector del buró (RF-INT-02.1, contracts/connectors/bureau.v1.yaml). Sin modo local:
    # siempre HTTP. read-timeout muy por debajo del presupuesto de 2 s de la evaluación (HAB-04).
    bureau:
      url: ${DC_INTEGRATION_BUREAU_URL:http://localhost:8089}
      connect-timeout: ${DC_INTEGRATION_BUREAU_CONNECT_TIMEOUT:500ms}
      read-timeout: ${DC_INTEGRATION_BUREAU_READ_TIMEOUT:1500ms}

  assessment:
    collection-budget: ${DC_ASSESSMENT_COLLECTION_BUDGET:2s}

  # D-02: versión del modelo avanzado (plan PRO). Carga models/scoring-<versión>.onnx
  # y su .params.json, que el CI verifica contra ml/model/ (D-07).
  scoring:
    model-version: ${DC_SCORING_MODEL_VERSION:v2}

  encryption:
    master-key: ${DC_MASTER_KEY:dev-only-insecure-master-key-do-not-use-in-prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  pattern:
    # el id de correlación (RF-API-02.1) se agrega al MDC como "correlationId"
    level: "%5p [%X{correlationId:-}]"
