name: Deploy demo por etiqueta
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: demo-deploy
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - name: Preparar release y conexión verificada
        env:
          DEPLOY_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz --output=release.tar.gz HEAD
      - name: Desplegar revisión exacta de la etiqueta
        env:
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
        run: |
          scp release.tar.gz "$DEMO_USER@$DEMO_HOST:/srv/doggycredit/release-$GITHUB_SHA.tar.gz"
          ssh "$DEMO_USER@$DEMO_HOST" "mkdir -p /srv/doggycredit/releases/$GITHUB_SHA && tar -xzf /srv/doggycredit/release-$GITHUB_SHA.tar.gz -C /srv/doggycredit/releases/$GITHUB_SHA && cd /srv/doggycredit/releases/$GITHUB_SHA && bash scripts/deploy_demo.sh"
      - name: Eliminar clave temporal
        if: always()
        run: rm -f ~/.ssh/id_ed25519
