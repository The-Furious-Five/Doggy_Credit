name: CI

# Gates del backend (HAB-01 + HAB-02):
#   1. Docker disponible: si no hay Docker, el pipeline falla (los tests con
#      Testcontainers no se saltan en silencio).
#   2. `mvnw verify`: build + ArchitectureRulesTest (ArchUnit) +
#      ApplicationModulesTest (Spring Modulith, FF-01/FF-02) + resto de tests.
#   3. Gate de tests omitidos (ci/check_skipped_tests.py): un test omitido
#      solo pasa si está en ci/skipped-tests-allowlist.json y no venció.
#      Ver docs/runbooks/tests-omitidos.md.
# oasdiff es de SPIKE-5; ZAP, Trivy y gitleaks todavía no están — a
# propósito, para no fingir gates que aún no existen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Docker disponible (Testcontainers no se salta)
        run: docker info

      - name: Build + ArchUnit + Modulith + tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Gate de tests omitidos
        run: python3 ci/check_skipped_tests.py

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar y construir la SPA
        working-directory: web
        run: |
          npm ci
          npm run build
