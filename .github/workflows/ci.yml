name: CI

# Gates del backend (HAB-01 + HAB-02):
#   1. Docker disponible: si no hay Docker, el pipeline falla (los tests con
#      Testcontainers no se saltan en silencio).
#   2. `mvnw verify`: build + ArchitectureRulesTest (ArchUnit) +
#      ApplicationModulesTest (Spring Modulith, FF-01/FF-02) + resto de tests.
#   3. Gate de tests omitidos (ci/check_skipped_tests.py): un test omitido
#      solo pasa si está en ci/skipped-tests-allowlist.json y no venció.
#      Ver docs/runbooks/tests-omitidos.md.
# SPIKE-5 agrega regeneración y oasdiff; SPIKE-2 agrega identidad real en Compose.

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Docker disponible (Testcontainers no se salta)
        run: docker info

      - name: Build + ArchUnit + Modulith + tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Gate de tests omitidos
        run: python3 ci/check_skipped_tests.py

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar y construir la SPA
        working-directory: web
        run: |
          npm ci
          npm run ds:check
          npm run ds:test
          npm run build
          npm test -- --watch=false

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Generación reproducible
        run: |
          python scripts/generate_realm.py
          bash scripts/generate_clients.sh
          git diff --exit-code -- infra/keycloak/doggycredit-realm.json web/src/app/api
          test -z "$(git ls-files --others --exclude-standard web/src/app/api)"
      - name: Rechazar cambios incompatibles del contrato
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:contracts/openapi/doggycredit-api.v1.yaml" > contracts/openapi/base.yaml
          docker run --rm -v "$PWD/contracts/openapi:/spec:ro" tufin/oasdiff:1.11.7 breaking /spec/base.yaml /spec/doggycredit-api.v1.yaml --fail-on ERR

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Levantar Compose con credenciales sintéticas de ejemplo
        run: |
          python scripts/generate_realm.py
          docker compose --env-file .env.example -f infra/compose.yaml -f infra/compose.override.yaml up -d --build --wait --wait-timeout 180
          curl --retry 30 --retry-all-errors --retry-delay 2 --fail --silent http://localhost:8080/actuator/health
      - name: PKCE humano y client_credentials contra API real
        run: |
          set -a
          source .env.example
          set +a
          python e2e/identity_smoke.py
      - name: Detener contenedores de CI
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml -f infra/compose.override.yaml down
