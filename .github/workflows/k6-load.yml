name: E-07 · Carga k6 y aislamiento por tenant

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/k6/**'
      - 'docs/runbooks/carga-k6-e07.md'
      - '.github/workflows/k6-load.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/k6/**'
      - 'docs/runbooks/carga-k6-e07.md'
      - '.github/workflows/k6-load.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: k6 · Dos tenants, p95 < 2 s y cero cruces
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: doggycredit-k6
      K6_BASE_URL: https://localhost
      # Únicamente para el Compose con certificado local. curl verifica su CA.
      K6_INSECURE_TLS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.8.1'

      - name: Verificar generador, umbrales y clasificación del reporte
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest discover -s e2e/k6 -p 'test_*.py'
          node --test e2e/k6/support.test.mjs
          python e2e/k6/generate_fixture.py
          cd e2e/k6
          k6 inspect credit-assessments.js

      - name: Levantar Compose aislado y verificar salud
        run: |
          python scripts/generate_realm.py --origin https://localhost
          docker compose --env-file .env.example -f infra/compose.yaml up -d --build --wait --wait-timeout 300
          docker compose --env-file .env.example -f infra/compose.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/doggycredit-k6-root.crt"
          curl --retry 30 --retry-all-errors --retry-delay 2 --fail --silent --cacert "$RUNNER_TEMP/doggycredit-k6-root.crt" https://localhost/actuator/health

      - name: Ejecutar carga y publicar resultado en el resumen del job
        run: |
          set -a
          source .env.example
          set +a
          trap 'if test -f e2e/k6/results/result.md; then cat e2e/k6/results/result.md >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          bash e2e/k6/run.sh

      - name: Conservar reporte JSON y resultado para el runbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e07-k6-resultados
          path: e2e/k6/results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mostrar logs del sistema si falló
        if: failure()
        run: docker compose --env-file .env.example -f infra/compose.yaml logs --no-color --timestamps --tail=150 doggycredit-api keycloak postgres wiremock-bureau

      - name: Apagar únicamente el Compose de este job
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml down --volumes --remove-orphans
