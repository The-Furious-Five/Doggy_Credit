openapi: 3.1.0
info:
  title: Billetera móvil (simulada) — movimientos del titular
  version: "1.0.0"
  description: >
    Contrato del proveedor EXTERNO de billetera móvil tal como lo expone su
    simulador (simulators/wiremock/wallet, generado por
    seed/generate_synthetic.py a partir de las mismas 50 personas que el
    buró). No es API de DoggyCredit: documenta lo que consume el conector del
    módulo `integration` (B-05). El vocabulario del proveedor no pasa de la
    capa anticorrupción `integration.internal.WalletJson`; lo que sale del
    conector es el fragmento canónico `WalletReport` (Perfil Financiero 360 v1).

    Verificado por `WalletConnectorContractTests` contra el simulador real
    (imagen wiremock/wiremock:3.9.1, la misma de infra/compose.yaml).

    Tiempos: toda respuesta 200 llega tras ~300 ms. El conector corta a los
    1500 ms (`DC_INTEGRATION_WALLET_READ_TIMEOUT`).
servers:
  - url: http://localhost:8091
    description: Simulador en Compose, publicado al host (DC_WIREMOCK_WALLET_HOST_PORT)
  - url: http://wiremock-wallet:8080
    description: Simulador dentro de la red de Compose

paths:
  /wallet/v1/titulares/{documento}:
    get:
      operationId: obtenerMovimientosTitular
      summary: Cantidad y montos de movimientos de los últimos 6 meses de un titular
      description: >
        Match exacto de URL: el simulador responde solo al documento
        normalizado (`shared.DocumentNumber`). Documentos especiales para
        pruebas: `CI-DEMO-0009503` responde 503; `CI-DEMO-0009504` responde
        200 recién a los 15 s (prueba de timeout).
      parameters:
        - name: X-API-Key
          in: header
          required: false
          description: >
            RF-INT-07. El conector envía la clave propia del tenant o la de DoggyCredit.
            Ausente si ninguna está configurada; los simuladores de demo no exigen autenticación.
            Nunca se envía en URL ni se registra en logs.
          schema: { type: string, writeOnly: true }
        - name: documento
          in: path
          required: true
          schema:
            type: string
            examples: [CI-DEMO-0001001, NIT-DEMO-9001001]
      responses:
        "200":
          description: Movimientos del titular (tras ~300 ms).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovimientosTitular" }
              example:
                titular: { documento: CI-DEMO-0001003, fechaAlta: "2022-02-01" }
                moneda: BOB
                fechaCorte: "2026-09-01"
                saldoPromedio: "1760.00"
                resumenMensual:
                  - { mes: "2026-03", cantidadTransacciones: 58, montoRecibido: "3840.00", montoEnviado: "2910.00" }
        "404":
          description: >
            El documento no tiene billetera (`TITULAR_NO_REGISTRADO`).
            Resultado válido ("sin billetera"), distinto de una caída.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBilletera" }
              example: { error: TITULAR_NO_REGISTRADO, documento: CI-DEMO-0009999 }
        "503":
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo: { type: string, enum: [SERVICIO_NO_DISPONIBLE] }

components:
  schemas:
    Monto:
      type: string
      description: Decimal con 2 cifras, como string.
      pattern: '^\d+\.\d{2}$'

    MovimientosTitular:
      type: object
      required: [titular, moneda, fechaCorte, saldoPromedio, resumenMensual]
      properties:
        titular:
          type: object
          required: [documento, fechaAlta]
          properties:
            documento:
              type: string
              description: Documento normalizado; siempre igual al pedido.
            fechaAlta: { type: string, format: date }
        moneda: { type: string, enum: [BOB, USD] }
        fechaCorte: { type: string, format: date }
        saldoPromedio: { $ref: "#/components/schemas/Monto" }
        resumenMensual:
          type: array
          description: Últimos meses cerrados antes de la fecha de corte, del más antiguo al más reciente (máx. 12).
          maxItems: 12
          items:
            type: object
            required: [mes, cantidadTransacciones, montoRecibido, montoEnviado]
            properties:
              mes: { type: string, pattern: '^\d{4}-\d{2}$' }
              cantidadTransacciones: { type: integer, minimum: 0 }
              montoRecibido: { $ref: "#/components/schemas/Monto" }
              montoEnviado: { $ref: "#/components/schemas/Monto" }

    ErrorBilletera:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [TITULAR_NO_REGISTRADO] }
        documento: { type: string }
