openapi: 3.1.0
info:
  title: DoggyCredit API
  version: "1.0.0"
  description: >
    API pública de DoggyCredit v1. Contract-first: este archivo es la fuente
    de verdad; el controlador Spring y el cliente TypeScript se generan desde
    aquí (SPIKE-5). No se agregan endpoints al código sin agregarlos primero
    aquí. Ver el capítulo 4 de la guía de inducción del Sprint 1.
servers:
  - url: https://localhost/api/v1
    description: Local (Compose, vía Caddy)

security:
  - bearerAuth: []

tags:
  - name: consentimientos
  - name: solicitantes
  - name: evaluaciones
  - name: claves-api

paths:
  /solicitantes:
    post:
      tags: [solicitantes]
      operationId: crearSolicitante
      summary: Registra los datos declarados de un solicitante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitanteNuevo"
      responses:
        "201":
          description: Solicitante creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitante"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          $ref: "#/components/responses/ErrorNegocio"
        "422":
          $ref: "#/components/responses/ErrorNegocio"

  /consentimientos:
    post:
      tags: [consentimientos]
      operationId: crearConsentimiento
      summary: Registra el consentimiento de un titular para una o más fuentes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentimientoNuevo"
      responses:
        "201":
          description: Consentimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consentimiento"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/ErrorNegocio"

  /credit-assessments:
    post:
      tags: [evaluaciones]
      operationId: crearEvaluacion
      summary: Solicita una evaluación de crédito para un titular
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionNueva"
      responses:
        "201":
          description: Evaluación creada (o PARCIAL si faltó una fuente no obligatoria)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/ErrorNegocio"
        "429":
          $ref: "#/components/responses/ErrorNegocio"

  /credit-assessments/{id}:
    get:
      tags: [evaluaciones]
      operationId: obtenerEvaluacion
      summary: Consulta una evaluación por id (aislada por tenant; 404 si es de otro tenant)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evaluación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: No existe, o pertenece a otro tenant (nunca se distingue cuál)

  /api-keys:
    get:
      tags: [claves-api]
      operationId: listarClavesApi
      summary: Claves de API vigentes del tenant, de la más reciente a la más antigua (solo TENANT_ADMIN)
      responses:
        "200":
          description: Claves vigentes (las revocadas no se listan)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaveApi"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
    post:
      tags: [claves-api]
      operationId: crearClaveApi
      summary: Crea una clave de API (client credentials de Keycloak) para el tenant (solo TENANT_ADMIN)
      description: >
        La clave es un cliente OAuth 2.0 `client_credentials` cuyo token lleva el
        `tenant_id` de quien la crea y el rol `API_CLIENT`. El secreto se devuelve
        una sola vez, en esta respuesta; después solo se conservan sus últimos 4
        caracteres. `produccion` requiere el plan PRO (FEATURE_NOT_IN_PLAN en FREE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaveApiNueva"
      responses:
        "201":
          description: Clave creada; `secreto` no vuelve a mostrarse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaveApiCreada"
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "502":
          $ref: "#/components/responses/ErrorNegocio"

  /api-keys/{id}:
    delete:
      tags: [claves-api]
      operationId: revocarClaveApi
      summary: Revoca una clave de API; desde ese momento no obtiene tokens nuevos (solo TENANT_ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Clave revocada
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          $ref: "#/components/responses/ErrorNegocio"
        "502":
          $ref: "#/components/responses/ErrorNegocio"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    NoAutenticado:
      description: Token ausente, expirado o inválido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ErrorNegocio:
      description: Error de negocio (ver el campo `code` del catálogo único)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457. El `code` sale siempre de contracts/errors/catalog.yaml.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
      required: [type, title, status, code, correlationId]

    ConsentimientoNuevo:
      type: object
      properties:
        titularDocumento: { type: string }
        fuentes:
          type: array
          items: { type: string, enum: [BURO, BANCO, WALLET] }
        finalidad: { type: string }
        vigenciaDias: { type: integer, default: 90 }
      required: [titularDocumento, fuentes, finalidad]

    Consentimiento:
      allOf:
        - $ref: "#/components/schemas/ConsentimientoNuevo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [ACTIVO, REVOCADO, EXPIRADO] }
            creadoEn: { type: string, format: date-time }

    SolicitanteNuevo:
      type: object
      properties:
        documento: { type: string, minLength: 3, maxLength: 64 }
        actividad: { type: string, minLength: 2, maxLength: 120 }
        antiguedadActividadMeses: { type: integer, minimum: 0, maximum: 1200 }
        ingresosMensuales:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          description: "Decimal positivo como string"
        moneda: { type: string, enum: [BOB, USD], default: BOB }
        destinoCredito: { type: string, minLength: 2, maxLength: 250 }
      required: [documento, actividad, antiguedadActividadMeses, ingresosMensuales, moneda, destinoCredito]

    Solicitante:
      allOf:
        - $ref: "#/components/schemas/SolicitanteNuevo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }
          required: [id, creadoEn]

    EvaluacionNueva:
      type: object
      properties:
        titularDocumento: { type: string, minLength: 3, maxLength: 64 }
        consentId: { type: string, format: uuid }
        proposito: { type: string, maxLength: 250 }
        montoSolicitado:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          description: "Decimal positivo como string"
        plazoMeses: { type: integer, minimum: 1, maximum: 360 }
      required: [titularDocumento, consentId]

    Evaluacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, PARCIAL, PREAPROBADO, REVISION_MANUAL, FALLIDA]
        score: { type: integer }
        banda: { type: string, enum: [A, B, C, D, E] }
        razones:
          type: array
          items: { type: string }
        modelVersion: { type: string }
        simulado: { type: boolean, default: true }
        correlationId: { type: string }

    ClaveApiNueva:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80, description: "Para reconocerla después, p. ej. App móvil" }
        entorno: { type: string, enum: [sandbox, produccion], default: sandbox }
      required: [nombre]

    ClaveApi:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        clientId: { type: string, description: "client_id para el grant client_credentials" }
        sufijoSecreto: { type: string, minLength: 4, maxLength: 4, description: "Últimos 4 caracteres del secreto, para reconocerla" }
        entorno: { type: string, enum: [sandbox, produccion] }
        creadaEn: { type: string, format: date-time }
      required: [id, nombre, clientId, sufijoSecreto, entorno, creadaEn]

    ClaveApiCreada:
      allOf:
        - $ref: "#/components/schemas/ClaveApi"
        - type: object
          properties:
            secreto: { type: string, description: "client_secret; solo aparece en la respuesta de creación" }
            tokenUrl: { type: string, format: uri, description: "Endpoint de token de Keycloak para el grant client_credentials" }
          required: [secreto, tokenUrl]
