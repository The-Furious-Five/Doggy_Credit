openapi: 3.1.0
info:
  title: DoggyCredit API
  version: "1.0.0"
  description: >
    API pública de DoggyCredit v1. Contract-first: este archivo es la fuente
    de verdad; el controlador Spring y el cliente TypeScript se generan desde
    aquí (SPIKE-5). No se agregan endpoints al código sin agregarlos primero
    aquí. Ver el capítulo 4 de la guía de inducción del Sprint 1.
servers:
  - url: https://localhost/api/v1
    description: Local (Compose, vía Caddy)

security:
  - bearerAuth: []

tags:
  - name: consentimientos
  - name: solicitantes
  - name: evaluaciones
  - name: integraciones
  - name: credenciales-integraciones
  - name: auditoria
  - name: tenant
  - name: admin
  - name: claves-api
  - name: politicas
  - name: productos
  - name: analytics
  - name: webhooks
  - name: revision-manual
  - name: planes
  - name: reporte-accesos
  - name: operador
    description: >
      RF-ANA-04 (D-14). Métricas agregadas de la plataforma para PLATFORM_ADMIN. Tag propio:
      con skipDefaultInterface, sumar la operación a AdminApi rompería la compilación de
      AdminController hasta que D-14 la implemente.

paths:

  /webhooks:
    get:
      tags: [webhooks]
      operationId: obtenerWebhooks
      summary: Configuración de Webhooks del tenant autenticado (Pro)
      description: Solo TENANT_ADMIN. El secreto HMAC nunca se devuelve.
      responses:
        "200":
          description: Configuración actual; URL nula y eventos vacíos si no está configurada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookConfiguracion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
    put:
      tags: [webhooks]
      operationId: actualizarWebhooks
      summary: Configura o desactiva Webhooks para el tenant autenticado (Pro)
      description: >
        Solo TENANT_ADMIN. La primera configuración requiere un secreto HMAC de
        32–128 caracteres; omitirlo después conserva el existente. URL nula con
        eventos vacíos desactiva las entregas. Cambiar la configuración cancela
        las entregas pendientes; una llamada ya en curso puede finalizar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCambio" }
      responses:
        "200":
          description: Configuración guardada, sin secreto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookConfiguracion" }
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  /analytics/resumen:
    get:
      tags: [analytics]
      operationId: obtenerResumenAnalytics
      summary: KPIs del tenant autenticado para un intervalo de fechas
      description: >
        Fechas inclusivas en America/La_Paz; por defecto el mes actual. El tenant
        se obtiene exclusivamente del JWT y el plan del catálogo del servidor.
        Todos los planes reciben los KPIs básicos. El objeto pro se omite si el
        plan no habilita analytics (actualmente Pro y Enterprise).
        Integraciones activas refleja el estado actual, independiente del intervalo.
        Los resultados históricos sin snapshot de recomendación o duración no se inventan.
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resumen agregado del tenant, sin datos personales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsResumen" }
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  /solicitantes:
    get:
      tags: [solicitantes]
      operationId: listarSolicitantes
      summary: Solicitantes del tenant, del más reciente al más antiguo, paginados
      parameters:
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: segmento
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Segmento" }
        - name: X-Documento
          in: header
          required: false
          description: >
            Búsqueda exacta por documento. Va en una cabecera y no en la URL para
            que el documento no quede en logs de acceso ni trazas; el servidor lo
            normaliza y busca por su HMAC, nunca por el valor en claro.
          schema: { type: string, minLength: 3, maxLength: 64 }
      responses:
        "200":
          description: Página de solicitantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaSolicitantes"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [solicitantes]
      operationId: crearSolicitante
      summary: Registra los datos declarados de un solicitante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitanteNuevo"
      responses:
        "201":
          description: Solicitante creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitante"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          $ref: "#/components/responses/ErrorNegocio"
        "422":
          $ref: "#/components/responses/ErrorNegocio"


  /solicitantes/{id}:
    get:
      tags: [solicitantes]
      operationId: obtenerSolicitante
      summary: Un solicitante con su Perfil Financiero 360 más reciente (404 si es de otro tenant)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Solicitante encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitanteDetalle"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/ErrorNegocio"


  /consentimientos:
    get:
      tags: [consentimientos]
      operationId: listarConsentimientos
      summary: Consentimientos de un solicitante (vigentes, revocados y expirados), del más reciente al más antiguo
      parameters:
        - name: solicitanteId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Consentimientos del titular
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consentimiento"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/ErrorNegocio"
    post:
      tags: [consentimientos]
      operationId: crearConsentimiento
      summary: Registra el consentimiento de un titular para una o más fuentes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentimientoNuevo"
      responses:
        "201":
          description: Consentimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consentimiento"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/ErrorNegocio"


  /consentimientos/{id}/revocar:
    post:
      tags: [consentimientos]
      operationId: revocarConsentimiento
      summary: >
        Revoca un consentimiento. Desde ese momento ninguna fuente que cubría se
        consulta con él y una evaluación que lo referencie responde CONSENT_REQUIRED.
        Idempotente: revocar uno ya revocado o expirado lo devuelve sin cambios.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Consentimiento revocado (o su estado actual si ya no estaba vigente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consentimiento"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/ErrorNegocio"


  /integraciones:
    get:
      tags: [integraciones]
      operationId: listarIntegraciones
      summary: Los 6 conectores del catálogo y su estado para el tenant
      description: >
        CONECTADO = activo, la evaluación lo consulta. DISPONIBLE = se puede
        activar. REQUIERE_PRO = el plan del tenant llegó a su máximo de
        integraciones activas. PROXIMAMENTE = sin implementación (DEBT-004).
        El buró es obligatorio: siempre CONECTADO.
      responses:
        "200":
          description: Catálogo con estado por tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integracion"
        "401":
          $ref: "#/components/responses/NoAutenticado"


  /integraciones/{fuente}:
    put:
      tags: [integraciones]
      operationId: actualizarIntegracion
      summary: Activa o desactiva un conector para el tenant
      parameters:
        - name: fuente
          in: path
          required: true
          schema: { $ref: "#/components/schemas/FuenteIntegracion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegracionCambio"
      responses:
        "200":
          description: Estado resultante del conector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integracion"
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          $ref: "#/components/responses/ErrorNegocio"


  /integraciones/{fuente}/credenciales:
    parameters:
      - name: fuente
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ProveedorCredenciales" }
    get:
      tags: [credenciales-integraciones]
      operationId: obtenerCredencialesIntegracion
      summary: Estado de las credenciales propias del tenant
      description: >
        RF-INT-07. Solo TENANT_ADMIN del tenant del JWT. Devuelve únicamente si
        están configuradas y los últimos cuatro caracteres; nunca el secreto.
        BANCO_DOS identifica al proveedor alternativo de BANCO, no otra fuente activa.
      responses:
        "200":
          description: Metadatos seguros, incluso si no hay credenciales propias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoCredencialesIntegracion" }
        "400": { $ref: "#/components/responses/ErrorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/ErrorNegocio" }
    put:
      tags: [credenciales-integraciones]
      operationId: guardarCredencialesIntegracion
      summary: Registra o reemplaza la clave propia para este proveedor
      description: >
        Solo TENANT_ADMIN. Cifrado con la DEK del tenant (RF-SEG-05), aislamiento
        RLS y auditoría sin secretos. Se envía como X-API-Key al conector elegido.
        No activa fuentes ni modifica límites del plan o consentimientos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredencialesIntegracionNuevas" }
      responses:
        "200":
          description: Metadatos seguros de la clave guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoCredencialesIntegracion" }
        "400": { $ref: "#/components/responses/ErrorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/ErrorNegocio" }
    delete:
      tags: [credenciales-integraciones]
      operationId: eliminarCredencialesIntegracion
      summary: Elimina la clave propia y vuelve a las credenciales de DoggyCredit
      description: Solo TENANT_ADMIN. Idempotente; el secreto no se devuelve ni se audita.
      responses:
        "204": { description: Sin credenciales propias para este proveedor }
        "400": { $ref: "#/components/responses/ErrorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/ErrorNegocio" }

  /credit-assessments:
    get:
      tags: [evaluaciones]
      operationId: listarEvaluaciones
      summary: Evaluaciones del tenant, de la más reciente a la más antigua, paginadas
      parameters:
        - name: solicitanteId
          in: query
          required: false
          description: Solo las evaluaciones de este solicitante (historial de la pestaña Score)
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: false
          description: Incluye evaluaciones creadas en o después de este instante
          schema: { type: string, format: date-time }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Página de evaluaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaEvaluaciones"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [evaluaciones]
      operationId: crearEvaluacion
      summary: Solicita una evaluación de crédito para un titular
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionNueva"
      responses:
        "201":
          description: Evaluación creada (o PARCIAL si faltó una fuente no obligatoria)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/ErrorNegocio"
        "429":
          $ref: "#/components/responses/ErrorNegocio"


  /credit-assessments/{id}:
    get:
      tags: [evaluaciones]
      operationId: obtenerEvaluacion
      summary: Consulta una evaluación por id (aislada por tenant; 404 si es de otro tenant)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evaluación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: No existe, o pertenece a otro tenant (nunca se distingue cuál)


  # RF-DEC-03 (D-10 / C-10 / E-10). Propuesto por E-10 y adoptado sin cambios por D-10.
  # Tag propio: el backend genera RevisionManualApi sin implementación por defecto, así
  # que agregar estas rutas no obliga a tocar los controladores existentes.
  /revision-manual:
    get:
      tags: [revision-manual]
      operationId: listarCasosRevision
      summary: >
        Bandeja de revisión manual: evaluaciones del tenant en REVISION_MANUAL, de la
        más antigua a la más reciente (ANALYST y TENANT_ADMIN)
      parameters:
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Página de casos pendientes y productos que se pueden elegir al aprobar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCasosRevision"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  /revision-manual/{evaluacionId}/resolucion:
    post:
      tags: [revision-manual]
      operationId: resolverCasoRevision
      summary: >
        Resuelve un caso en revisión manual (override) con justificación obligatoria; al
        aprobar se elige el producto. Queda en audit.access_log con el X-Correlation-Id
        (ANALYST y TENANT_ADMIN)
      parameters:
        - name: evaluacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolucionNueva"
      responses:
        "200":
          description: Caso resuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolucion"
        "400":
          description: >
            VALIDATION_ERROR: falta la justificación (o es demasiado corta), o se aprueba
            sin producto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          description: >
            ASSESSMENT_NOT_FOUND (no existe o es de otro tenant) o PRODUCT_NOT_FOUND
            (producto inexistente, inactivo o de otro tenant)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: CONCURRENT_UPDATE, el caso ya no está en revisión manual (otra persona lo resolvió)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"


  /auditoria:
    get:
      tags: [auditoria]
      operationId: listarAuditoria
      summary: Bitácora de auditoría del tenant, de la más reciente a la más antigua (solo TENANT_ADMIN)
      description: >
        Paginación por cursor (informe de arquitectura: "cursor en bitácoras").
        Para la página siguiente se envía como `cursor` el `siguienteCursor` de la
        respuesta anterior.
      parameters:
        - name: desde
          in: query
          required: false
          description: Incluye registros creados en o después de este instante
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          description: Incluye registros creados antes de este instante (exclusivo)
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Secuencia del último registro de la página anterior
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de la bitácora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaAuditoria"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  # RF-CON-03 (D-10 / C-11). Tag propio: AuditoriaApi ya está implementada, y sumar
  # parámetros a listarAuditoria cambiaría la firma generada de AuditQueryController.
  /auditoria/accesos:
    get:
      tags: [reporte-accesos]
      operationId: obtenerReporteAccesos
      summary: >
        Reporte de accesos: quién accedió a los datos de un titular y con qué autorización
        (solo TENANT_ADMIN)
      description: >
        RF-CON-03. Se filtra por titular (`solicitanteId`), por `correlationId` o por ambos;
        al menos uno es obligatorio (sin ninguno, 400 VALIDATION_ERROR). Por titular devuelve
        toda acción registrada sobre sus recursos: alta, consentimientos, consultas a las
        fuentes, Perfil 360, evaluaciones, lecturas y resoluciones de revisión manual. Por
        correlation-id devuelve lo que hizo una sola petición. De lo más reciente a lo más
        antiguo, con paginación por cursor como /auditoria. Lee de audit.access_log por la
        API pública del módulo audit, sin JOIN entre esquemas. La respuesta no lleva datos
        personales: el titular va por id. Generar el reporte también queda en la bitácora.
      parameters:
        - name: solicitanteId
          in: query
          required: false
          description: Titular del reporte. Inexistente o de otro tenant responde 404 UNKNOWN_APPLICANT
          schema: { type: string, format: uuid }
        - name: correlationId
          in: query
          required: false
          description: X-Correlation-Id de una petición; coincidencia exacta
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: desde
          in: query
          required: false
          description: Incluye registros creados en o después de este instante
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          description: Incluye registros creados antes de este instante (exclusivo)
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Secuencia del último registro de la página anterior
          schema: { type: integer, format: int64, minimum: 1 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Página del reporte con las autorizaciones que aparecen en ella
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteAccesos"
        "400":
          description: VALIDATION_ERROR, sin `solicitanteId` ni `correlationId`, o un parámetro inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          description: UNKNOWN_APPLICANT, el solicitante no existe o es de otro tenant (nunca se distingue cuál)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /tenant/actual:
    get:
      tags: [tenant]
      operationId: obtenerTenantActual
      summary: Devuelve los datos del tenant autenticado (extraídos del JWT)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantActual'
        "401":
          $ref: '#/components/responses/NoAutenticado'


  /tenant/actual/equipo:
    get:
      tags: [tenant]
      operationId: listarEquipo
      summary: Lista los miembros del equipo del tenant actual
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MiembroEquipo'
        "401":
          $ref: '#/components/responses/NoAutenticado'
        "502":
          $ref: '#/components/responses/ErrorNegocio'


  /tenant/actual/preferencias:
    get:
      tags: [tenant]
      operationId: obtenerPreferenciasTenant
      summary: Consulta las preferencias de seguridad del tenant actual
      responses:
        "200":
          description: Preferencias actuales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasTenant'
        "401":
          $ref: '#/components/responses/NoAutenticado'
    patch:
      tags: [tenant]
      operationId: actualizarPreferenciasTenant
      summary: Actualiza las preferencias de seguridad (solo TENANT_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasTenant'
      responses:
        "200":
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasTenant'
        "403":
          description: Sin permisos


  /tenant/actual/uso:
    get:
      tags: [tenant]
      operationId: obtenerUsoTenant
      summary: Consulta uso de evaluaciones del mes y límite del plan actual
      description: >
        RF-ANA-01 (B-12). Cualquier rol del tenant. El mes es el calendario UTC, el mismo de
        la cuota. integracionesActivas y limiteIntegraciones reflejan el estado actual y el
        plan vigente (0 = sin límite). Una evaluación repetida con la misma Idempotency-Key
        no suma consumo.
      responses:
        "200":
          description: Uso mensual actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsoTenant'
        "401":
          $ref: '#/components/responses/NoAutenticado'


  /tenant/actual/organizacion:
    patch:
      tags: [tenant]
      operationId: actualizarOrganizacionTenant
      summary: Actualiza el nombre visible de la institución (solo TENANT_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizacionTenantPatch'
      responses:
        "200":
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantActual'
        "403":
          description: Sin permisos


  # RF-PLN-04 / RF-PLN-05 (D-10 / A-11 / A-12). Subir de plan es PATCH /admin/tenants/{id}
  # (operador). Tag propio por la misma razón que revision-manual: con
  # skipDefaultInterface, sumar operaciones a TenantApi rompería la compilación de
  # TenantController hasta que A-12 las implemente.
  /tenant/actual/plan:
    get:
      tags: [planes]
      operationId: obtenerEstadoPlan
      summary: Plan del tenant autenticado, período en curso, bajada programada y gracia vigente
      description: >
        Cualquier rol del tenant. El período es el mes calendario en UTC, el mismo con el
        que se cuenta la cuota mensual. El tenant sale exclusivamente del JWT.
      responses:
        "200":
          description: Estado del plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoPlan"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /tenant/actual/plan/bajada:
    put:
      tags: [planes]
      operationId: programarBajadaPlan
      summary: Programa la bajada de plan para el cierre del período (solo TENANT_ADMIN)
      description: >
        RF-PLN-05. No cambia nada hoy: el plan actual sigue hasta `periodo.fin`. Al cierre,
        el tenant pasa a `planDestino` y empiezan 30 días de gracia: las integraciones que
        excedan el plan nuevo quedan desactivadas, no borradas; la preaprobación automática
        (nivel 1) vuelve a decisión sugerida, y nada se purga antes de `gracia.hasta`. Si
        durante la gracia el operador vuelve a subir el plan, el tenant recupera lo
        desactivado. Programar otra vez reemplaza la bajada anterior. Queda en
        audit.access_log con el X-Correlation-Id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BajadaPlanNueva"
      responses:
        "200":
          description: Bajada programada; el plan actual no cambia hasta el cierre del período
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoPlan"
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "409":
          description: PLAN_CHANGE_NOT_ALLOWED, `planDestino` no es inferior al plan actual
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags: [planes]
      operationId: cancelarBajadaPlan
      summary: Cancela la bajada programada antes del cierre del período (solo TENANT_ADMIN)
      description: >
        Idempotente: sin bajada programada devuelve el estado igual. No termina una gracia
        ya iniciada; eso solo ocurre si el operador vuelve a subir el plan. Queda en
        audit.access_log con el X-Correlation-Id.
      responses:
        "200":
          description: Estado del plan, sin bajada programada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoPlan"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"


  /admin/tenants:
    get:
      tags: [admin]
      operationId: listarTenants
      summary: Lista todos los tenants (solo PLATFORM_ADMIN)
      description: Incluye evaluacionesMes del mes calendario UTC y limiteMensual del plan (0 = sin límite).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantActual'
        "401":
          $ref: '#/components/responses/NoAutenticado'
        "403":
          description: Sin permisos de administración


  /admin/tenants/{id}:
    patch:
      tags: [admin]
      operationId: actualizarTenant
      summary: Suspende o reactiva un tenant, o cambia su plan (solo PLATFORM_ADMIN)
      description: >
        RF-PLN-04: el operador sube el plan en el momento (pago simulado en el MVP). El cambio
        es efectivo en ≤ 1 min sin volver a iniciar sesión, porque los entitlements se leen
        del servidor en cada petición y no viajan en el token. Subir cancela una bajada
        programada y termina la gracia vigente. Aquí el cambio es inmediato en ambos
        sentidos: es la herramienta del operador (y del E2E para restaurar el plan). La bajada
        que pide el tenant va por PUT /tenant/actual/plan/bajada, al cierre del período.
        Todo cambio de plan queda en audit.access_log.
        RF-TEN-04: activo=false bloquea toda petición autenticada del tenant con 403
        TENANT_SUSPENDED (RFC 9457), tanto de personas como de claves de API, excepto
        PLATFORM_ADMIN. Reactivar recupera el acceso en ≤ 1 min con el mismo token.
        No se borra ningún dato. Suspender y reactivar se auditan con X-Correlation-Id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
      responses:
        "200":
          description: Tenant actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantActual'
        "401":
          $ref: '#/components/responses/NoAutenticado'
        "403":
          description: Sin permisos
        "404":
          description: Tenant no encontrado


  # RF-ANA-04 (D-14). Solo agregados: ningún dato individual de un tenant.
  /operador/metricas:
    get:
      tags: [operador]
      operationId: obtenerMetricasOperador
      summary: Métricas de negocio de la plataforma para un período (solo PLATFORM_ADMIN)
      description: >
        Fechas inclusivas en UTC; por defecto el mes calendario actual. tenantsPorPlan,
        tenantsActivos y tenantsSuspendidos son una foto al momento de la consulta;
        tenantsActivados, conversionesFreeAPro y evaluaciones se cuentan dentro del período.
        Una conversión es un cambio de plan FREE → PRO registrado en audit.access_log. No
        expone nombres, NIT ni identificadores de tenants. Otros roles reciben 403
        INSUFFICIENT_ROLE.
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Agregados de la plataforma
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricasOperador"
        "400":
          description: VALIDATION_ERROR, `desde` posterior a `hasta` o fecha inválida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          description: INSUFFICIENT_ROLE, el usuario no es PLATFORM_ADMIN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api-keys:
    get:
      tags: [claves-api]
      operationId: listarClavesApi
      summary: Claves de API vigentes del tenant, de la más reciente a la más antigua (solo TENANT_ADMIN)
      responses:
        "200":
          description: Claves vigentes (las revocadas no se listan)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaveApi"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
    post:
      tags: [claves-api]
      operationId: crearClaveApi
      summary: Crea una clave de API (client credentials de Keycloak) para el tenant (solo TENANT_ADMIN)
      description: >
        La clave es un cliente OAuth 2.0 `client_credentials` cuyo token lleva el
        `tenant_id` de quien la crea y el rol `API_CLIENT`. El secreto se devuelve
        una sola vez, en esta respuesta; después solo se conservan sus últimos 4
        caracteres. `produccion` requiere el plan PRO (FEATURE_NOT_IN_PLAN en FREE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaveApiNueva"
      responses:
        "201":
          description: Clave creada; `secreto` no vuelve a mostrarse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaveApiCreada"
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "502":
          $ref: "#/components/responses/ErrorNegocio"

  /api-keys/{id}:
    delete:
      tags: [claves-api]
      operationId: revocarClaveApi
      summary: Revoca una clave de API; desde ese momento no obtiene tokens nuevos (solo TENANT_ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Clave revocada
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          $ref: "#/components/responses/ErrorNegocio"
        "502":
          $ref: "#/components/responses/ErrorNegocio"

  /productos:
    get:
      tags: [productos]
      operationId: listarProductos
      summary: Catálogo de productos de crédito del tenant (solo TENANT_ADMIN)
      responses:
        "200":
          description: Productos del tenant, activos e inactivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  /productos/{id}:
    put:
      tags: [productos]
      operationId: actualizarProducto
      summary: Activa o desactiva un producto y ajusta sus rangos (solo TENANT_ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoCambios"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ErrorNegocio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          $ref: "#/components/responses/ErrorNegocio"
        "409":
          $ref: "#/components/responses/ErrorNegocio"

  /politicas:
    get:
      tags: [politicas]
      operationId: listarPoliticas
      summary: Reglas de decisión del tenant (solo TENANT_ADMIN)
      responses:
        "200":
          description: Reglas, activas y pausadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Politica"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"

  /politicas/{id}:
    put:
      tags: [politicas]
      operationId: actualizarPolitica
      summary: Activa o pausa una regla de decisión (solo TENANT_ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoliticaCambio"
      responses:
        "200":
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Politica"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorNegocio"
        "404":
          $ref: "#/components/responses/ErrorNegocio"
        "409":
          $ref: "#/components/responses/ErrorNegocio"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    NoAutenticado:
      description: Token ausente, expirado o inválido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ErrorNegocio:
      description: Error de negocio (ver el campo `code` del catálogo único)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:

    EventoWebhook:
      type: string
      enum: [ConsentGranted.v1, ConsentRevoked.v1, CreditAssessmentCompleted.v1]

    WebhookConfiguracion:
      type: object
      required: [eventos, secretoConfigurado]
      properties:
        url:
          type: [string, "null"]
          format: uri
          description: URL HTTPS absoluta, con un máximo de 2048 caracteres validado por el servidor.
        eventos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/EventoWebhook" }
        secretoConfigurado: { type: boolean }
        actualizadaEn: { type: [string, "null"], format: date-time }

    WebhookCambio:
      type: object
      required: [eventos]
      properties:
        url:
          type: [string, "null"]
          format: uri
          description: URL HTTPS absoluta, con un máximo de 2048 caracteres validado por el servidor.
        eventos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/EventoWebhook" }
        secreto:
          type: string
          minLength: 32
          maxLength: 128
          writeOnly: true
          description: Clave HMAC compartida con tu receptor. Omitirla conserva la actual.

    AnalyticsResumen:
      type: object
      required: [desde, hasta, plan, moneda, analiticaAvanzada, evaluaciones, integracionesActivas, porcentajeConRecomendacion, necesidades]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        plan: { type: string }
        moneda: { type: string }
        analiticaAvanzada: { type: boolean }
        evaluaciones: { type: integer, format: int64, minimum: 0 }
        scorePromedio:
          type: [number, "null"]
          format: double
          description: Escala 0–1000. Null cuando no hay evaluaciones.
        integracionesActivas: { type: integer, minimum: 1 }
        porcentajeConRecomendacion:
          type: number
          format: double
          description: Evaluaciones con un producto recomendado / total de evaluaciones × 100.
        necesidades:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsNecesidad" }
        pro:
          $ref: "#/components/schemas/AnalyticsPro"
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"

    AnalyticsNecesidad:
      type: object
      required: [categoria, cantidad, porcentaje]
      properties:
        categoria:
          type: string
          enum: [CAPITAL_TRABAJO, INVERSION_PRODUCTIVA, EFICIENCIA_ENERGETICA, CONSUMO_CONSOLIDACION]
        cantidad: { type: integer, format: int64, minimum: 0 }
        porcentaje:
          type: number
          format: double
          description: Porcentaje del total de evaluaciones; sin snapshot de necesidad no se asigna categoría.

    AnalyticsPro:
      type: object
      description: >
        distribucionBandas, tasaOverride y aceptacionPorProducto son los KPIs de cartera de
        RF-ANA-02 (C-14). Son opcionales para no romper a los consumidores actuales; desde
        C-14 el servidor los envía siempre, calculados sobre el mismo intervalo.
      required: [conversionPorcentaje, montoRecomendado, recomendacionesPorProducto, modelos]
      properties:
        conversionPorcentaje:
          type: number
          format: double
          description: Evaluaciones PREAPROBADO / total de evaluaciones × 100. No mide desembolsos.
        tiempoDecisionMedianaMs:
          type: [number, "null"]
          format: double
          description: Mediana del tiempo de procesamiento registrado, en milisegundos. Null sin muestras.
        montoRecomendado:
          type: string
          description: Suma del monto del primer producto recomendado, en la moneda del tenant; decimal exacto.
        recomendacionesPorProducto:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsProducto" }
        modelos:
          type: array
          description: Último monitoreo semanal D-08 por modelo, independiente del intervalo consultado.
          items: { $ref: "#/components/schemas/AnalyticsModelo" }
        distribucionBandas:
          type: array
          description: >
            Siempre las cinco bandas, de A a E y con 0 si no hay casos, sobre las evaluaciones
            del intervalo que tienen score (las FALLIDA no cuentan).
          items: { $ref: "#/components/schemas/AnalyticsBanda" }
        tasaOverride:
          $ref: "#/components/schemas/AnalyticsOverride"
        aceptacionPorProducto:
          type: array
          description: Un elemento por tipo de producto (MICROCREDITO, VERDE, PYME), con 0 si no hubo recomendaciones.
          items: { $ref: "#/components/schemas/AnalyticsAceptacionProducto" }

    AnalyticsBanda:
      type: object
      required: [banda, cantidad, porcentaje]
      properties:
        banda: { type: string, enum: [A, B, C, D, E] }
        cantidad: { type: integer, format: int64, minimum: 0 }
        porcentaje:
          type: number
          format: double
          description: Evaluaciones de la banda / evaluaciones con score del intervalo × 100. 0 si no hay base.

    AnalyticsOverride:
      type: object
      description: >
        Override = caso de revisión manual resuelto por una persona (POST
        /revision-manual/{evaluacionId}/resolucion), APROBADO o RECHAZADO. Se cuenta por la
        fecha de la evaluación, no por la de la resolución.
      required: [overrides, evaluaciones, porcentaje]
      properties:
        overrides: { type: integer, format: int64, minimum: 0 }
        evaluaciones:
          type: integer
          format: int64
          minimum: 0
          description: Base del cálculo, las evaluaciones con decisión del intervalo.
        porcentaje:
          type: number
          format: double
          description: overrides / evaluaciones × 100. 0 si no hay evaluaciones.

    AnalyticsAceptacionProducto:
      type: object
      description: >
        Recomendado = un producto de este tipo fue el primero del ranking C-06. Aceptado = esa
        evaluación quedó PREAPROBADO o se aprobó en revisión manual con un producto del mismo
        tipo. No mide desembolsos.
      required: [tipo, recomendados, aceptados, porcentaje]
      properties:
        tipo: { type: string, enum: [MICROCREDITO, VERDE, PYME] }
        recomendados: { type: integer, format: int64, minimum: 0 }
        aceptados: { type: integer, format: int64, minimum: 0 }
        porcentaje:
          type: number
          format: double
          description: aceptados / recomendados × 100. 0 si no hubo recomendaciones.

    AnalyticsProducto:
      type: object
      required: [tipo, cantidad, porcentaje, montoRecomendado]
      properties:
        tipo: { type: string, enum: [MICROCREDITO, VERDE, PYME] }
        cantidad: { type: integer, format: int64, minimum: 0 }
        porcentaje: { type: number, format: double, description: Porcentaje de las evaluaciones con recomendación. }
        montoRecomendado: { type: string }

    AnalyticsModelo:
      type: object
      required: [version, estado, desde, hasta, muestrasActuales, muestrasBase]
      properties:
        version: { type: string }
        psi: { type: [number, "null"], format: double }
        estado: { type: string, enum: [ESTABLE, VIGILAR, ALERTA, INSUFICIENTE] }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        muestrasActuales: { type: integer }
        muestrasBase: { type: integer }

    ProblemDetail:
      type: object
      description: RFC 9457. El `code` sale siempre de contracts/errors/catalog.yaml.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
      required: [type, title, status, code, correlationId]


    TenantActual:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        nit: { type: string }
        tipo: { type: string, enum: [IMF, FINTECH, BANCO, COOPERATIVA] }
        plan: { type: string, enum: [FREE, PRO, ENTERPRISE] }
        pais: { type: string }
        moneda: { type: string }
        activo: { type: boolean }
        evaluacionesMes:
          type: integer
          minimum: 0
          description: Solo en GET /admin/tenants. Evaluaciones del mes calendario UTC; 0 si no hay consumo.
        limiteMensual:
          type: integer
          minimum: 0
          description: Solo en GET /admin/tenants. Cuota mensual del plan actual; 0 significa sin límite.
      required: [id, nombre, nit, tipo, plan, pais, moneda, activo]


    MiembroEquipo:
      type: object
      properties:
        nombre: { type: string }
        email: { type: string }
        rol: { type: string }
        estado: { type: string, enum: [ACTIVO, INVITADO, DESACTIVADO] }
      required: [nombre, rol, estado]


    ConsentimientoNuevo:
      type: object
      properties:
        titularDocumento: { type: string }
        fuentes:
          type: array
          items: { type: string, enum: [BURO, BANCO, WALLET] }
        finalidad: { type: string }
        vigenciaDias: { type: integer, default: 90 }
      required: [titularDocumento, fuentes, finalidad]

    Consentimiento:
      allOf:
        - $ref: "#/components/schemas/ConsentimientoNuevo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [ACTIVO, REVOCADO, EXPIRADO] }
            creadoEn: { type: string, format: date-time }
            expiraEn: { type: string, format: date-time }
            revocadoEn: { type: string, format: date-time, description: Solo si estado es REVOCADO }


    SolicitanteNuevo:
      type: object
      properties:
        documento: { type: string, minLength: 3, maxLength: 64 }
        actividad: { type: string, minLength: 2, maxLength: 120 }
        antiguedadActividadMeses: { type: integer, minimum: 0, maximum: 1200 }
        ingresosMensuales:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          description: "Decimal positivo como string"
        moneda: { type: string, enum: [BOB, USD], default: BOB }
        destinoCredito: { type: string, minLength: 2, maxLength: 250 }
        segmento:
          $ref: "#/components/schemas/Segmento"
      required: [documento, actividad, antiguedadActividadMeses, ingresosMensuales, moneda, destinoCredito]


    Segmento:
      type: string
      enum: [PERSONA, EMPRENDEDOR, PYME]
      description: En el alta, PERSONA si no se indica. Sin valor por defecto aquí para que el filtro del listado sea opcional.

    Solicitante:
      allOf:
        - $ref: "#/components/schemas/SolicitanteNuevo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }
          required: [id, creadoEn]


    PaginaSolicitantes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Solicitante"
        total:
          type: integer
          format: int64
          description: Total de solicitantes que cumplen el filtro (para la paginación)
      required: [items, total]

    SolicitanteDetalle:
      allOf:
        - $ref: "#/components/schemas/Solicitante"
        - type: object
          properties:
            perfil:
              $ref: "#/components/schemas/PerfilFinanciero360"


    Dinero:
      type: object
      properties:
        amount: { type: string, description: "Decimal como string, nunca float" }
        currency: { type: string, enum: [BOB, USD] }
      required: [amount, currency]


    PerfilFinanciero360:
      type: object
      description: >
        Resumen del Perfil Financiero 360 (B-04) para las pestañas Resumen y
        Fuentes. Un campo ausente significa desconocido (la fuente que lo aporta
        no respondió o no se consultó), nunca cero.
      properties:
        id: { type: string, format: uuid }
        hash: { type: string, description: SHA-256 del snapshot canónico v1 }
        creadoEn: { type: string, format: date-time }
        ingresoMensual: { $ref: "#/components/schemas/Dinero" }
        origenIngreso: { type: string, enum: [BANCO, WALLET, DECLARADO] }
        ingresoDeclarado: { $ref: "#/components/schemas/Dinero" }
        discrepanciaIngreso:
          type: boolean
          description: >
            RF-PER-06: declarado y observado difieren en más de 30 %. Ausente
            si no hay observado con que comparar (origenIngreso DECLARADO).
        deudaVigente: { $ref: "#/components/schemas/Dinero" }
        obligaciones: { type: integer, minimum: 0 }
        cuotaMensual: { $ref: "#/components/schemas/Dinero" }
        endeudamientoPorcentaje:
          type: string
          description: Cuota sobre ingreso, en %, decimal como string (p. ej. "20.3")
        capacidadPago: { $ref: "#/components/schemas/Dinero" }
        antiguedadSistemaFinancieroMeses: { type: integer, minimum: 0 }
        fuentes:
          type: array
          items:
            type: object
            properties:
              fuente: { type: string, enum: [BURO, BANCO, WALLET] }
              estado: { type: string, enum: [COMPLETA, SIN_REGISTRO, NO_DISPONIBLE, NO_CONSULTADA] }
              consultadaEn: { type: string, format: date-time }
              sha256: { type: string }
            required: [fuente, estado]
      required: [id, hash, creadoEn, ingresoMensual, origenIngreso, fuentes]


    FuenteIntegracion:
      type: string
      enum: [BURO, BANCO, WALLET, OPEN_BANKING, FACTURACION, GARANTIAS]

    ProveedorCredenciales:
      type: string
      enum: [BURO, BANCO, BANCO_DOS, WALLET]

    CredencialesIntegracionNuevas:
      type: object
      additionalProperties: false
      required: [clave]
      properties:
        clave:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 2048
          pattern: '^[!-~]{8,2048}$'
          description: Clave API de caracteres ASCII visibles, sin espacios ni saltos de línea.

    EstadoCredencialesIntegracion:
      type: object
      additionalProperties: false
      required: [configuradas, ultimosCuatro]
      properties:
        configuradas: { type: boolean }
        ultimosCuatro:
          type: string
          pattern: '^([!-~]{4})?$'
          description: Últimos cuatro caracteres si configuradas; cadena vacía en caso contrario.


    Integracion:
      type: object
      properties:
        fuente: { $ref: "#/components/schemas/FuenteIntegracion" }
        estado: { type: string, enum: [CONECTADO, DISPONIBLE, REQUIERE_PRO, PROXIMAMENTE] }
      required: [fuente, estado]


    IntegracionCambio:
      type: object
      properties:
        activa: { type: boolean }
      required: [activa]


    EvaluacionNueva:
      type: object
      properties:
        titularDocumento: { type: string, minLength: 3, maxLength: 64 }
        consentId: { type: string, format: uuid }
        proposito: { type: string, maxLength: 250 }
        montoSolicitado:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          description: "Decimal positivo como string"
        plazoMeses: { type: integer, minimum: 1, maximum: 360 }
      required: [titularDocumento, consentId]


    Evaluacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, PARCIAL, PREAPROBADO, REVISION_MANUAL, FALLIDA]
        decision:
          type: string
          enum: [PREAPROBADO, REVISION_MANUAL, SOLICITAR_DATOS]
          description: >
            Decisión de las políticas activas del tenant (C-05). Nunca hay rechazo
            automático: un rechazo siempre pasa por una persona. Un resultado PARCIAL
            nunca se preaprueba (queda en REVISION_MANUAL). Con SOLICITAR_DATOS el
            estado es REVISION_MANUAL.
        score: { type: integer }
        banda: { type: string, enum: [A, B, C, D, E] }
        razones:
          type: array
          items: { type: string }
        modelVersion: { type: string }
        simulado: { type: boolean, default: true }
        correlationId: { type: string }
        elegibilidad:
          type: array
          description: >
            RF-REC-02 (E-16): snapshot de todos los productos activos del tenant al evaluar,
            disponible en todos los planes. Cada producto indica los seis criterios y si
            cumple todos. Se evalúa el monto propuesto tras ajustar RF-NEC-01 y el máximo
            del producto, y el plazo solicitado o el predeterminado de la necesidad.
            Las monedas diferentes y la capacidad no verificable no califican.
            Ausente en evaluaciones históricas anteriores a E-16; vacío si no había
            productos activos. Nunca se recalcula al consultar el perfil.
          items:
            $ref: "#/components/schemas/ElegibilidadProducto"
        recomendaciones:
          type: array
          description: >
            C-06: productos del catálogo del tenant para los que el titular es elegible,
            del más adecuado al menos, cada uno con su razón. Solo en los planes con
            recomendaciones (PRO y ENTERPRISE). Ausente si el plan no las incluye o si el
            resultado es PARCIAL (no se recomienda con fuentes fallidas); vacío si ningún
            producto aplica.
          items:
            $ref: "#/components/schemas/Recomendacion"


    RegistroAuditoria:
      type: object
      description: Un registro de la bitácora append-only, con su eslabón de la cadena de hash.
      properties:
        id: { type: string, format: uuid }
        secuencia: { type: integer, format: int64, description: "Posición en la cadena del tenant" }
        actor: { type: string }
        accion: { type: string }
        tipoRecurso: { type: string }
        idRecurso: { type: string, format: uuid }
        correlationId: { type: string }
        creadoEn: { type: string, format: date-time }
        hash: { type: string, description: "SHA-256 (hex) del registro, que incluye el hash del anterior" }
      required: [id, secuencia, actor, accion, tipoRecurso, correlationId, creadoEn, hash]


    PaginaAuditoria:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegistroAuditoria"
        siguienteCursor:
          type: integer
          format: int64
          description: Ausente si no hay más páginas
      required: [items]

    TenantPatch:
      type: object
      properties:
        activo: { type: boolean }
        plan: { type: string, enum: [FREE, PRO, ENTERPRISE] }


    PreferenciasTenant:
      type: object
      properties:
        enmascararDatos: { type: boolean }
      required: [enmascararDatos]


    UsoTenant:
      type: object
      properties:
        evaluacionesMes: { type: integer, minimum: 0 }
        limiteMensual: { type: integer, minimum: 0, description: 0 means unlimited }
        integracionesActivas:
          type: integer
          minimum: 0
          description: RF-ANA-01. Integraciones en estado CONECTADO hoy, el buró incluido.
        limiteIntegraciones:
          type: integer
          minimum: 0
          description: RF-ANA-01. Máximo de integraciones activas del plan vigente; 0 significa sin límite.
      required: [evaluacionesMes, limiteMensual]


    MetricasOperador:
      type: object
      description: RF-ANA-04 (D-14). Solo agregados de la plataforma, sin datos de tenants individuales.
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        tenantsPorPlan:
          type: array
          description: Un elemento por plan (FREE, PRO, ENTERPRISE), con 0 si no hay tenants.
          items: { $ref: "#/components/schemas/TenantsPorPlan" }
        tenantsActivos: { type: integer, format: int64, minimum: 0 }
        tenantsSuspendidos: { type: integer, format: int64, minimum: 0 }
        tenantsActivados:
          type: integer
          format: int64
          minimum: 0
          description: Tenants dados de alta o reactivados dentro del período.
        conversionesFreeAPro:
          type: integer
          format: int64
          minimum: 0
          description: Cambios de plan FREE → PRO dentro del período.
        evaluaciones:
          type: integer
          format: int64
          minimum: 0
          description: Evaluaciones de toda la plataforma dentro del período.
      required: [desde, hasta, tenantsPorPlan, tenantsActivos, tenantsSuspendidos, tenantsActivados, conversionesFreeAPro, evaluaciones]


    TenantsPorPlan:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/CodigoPlan" }
        cantidad: { type: integer, format: int64, minimum: 0 }
      required: [plan, cantidad]


    OrganizacionTenantPatch:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 100 }
      required: [nombre]

    ClaveApiNueva:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80, description: "Para reconocerla después, p. ej. App móvil" }
        entorno: { type: string, enum: [sandbox, produccion], default: sandbox }
      required: [nombre]

    ClaveApi:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        clientId: { type: string, description: "client_id para el grant client_credentials" }
        sufijoSecreto: { type: string, minLength: 4, maxLength: 4, description: "Últimos 4 caracteres del secreto, para reconocerla" }
        entorno: { type: string, enum: [sandbox, produccion] }
        creadaEn: { type: string, format: date-time }
      required: [id, nombre, clientId, sufijoSecreto, entorno, creadaEn]

    ClaveApiCreada:
      allOf:
        - $ref: "#/components/schemas/ClaveApi"
        - type: object
          properties:
            secreto: { type: string, description: "client_secret; solo aparece en la respuesta de creación" }
            tokenUrl: { type: string, format: uri, description: "Endpoint de token de Keycloak para el grant client_credentials" }
          required: [secreto, tokenUrl]

    EvaluacionResumen:
      type: object
      description: Una evaluación en un listado. El estado es la decisión (nunca un rechazo automático).
      properties:
        id: { type: string, format: uuid }
        solicitanteId: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, PARCIAL, PREAPROBADO, REVISION_MANUAL, FALLIDA]
        decision:
          type: string
          enum: [PREAPROBADO, REVISION_MANUAL, SOLICITAR_DATOS]
          description: "Decisión de las políticas (C-05), igual que en Evaluacion. Nunca un rechazo."
        score: { type: integer }
        banda: { type: string, enum: [A, B, C, D, E] }
        montoSolicitado: { type: string, description: "Decimal como string" }
        plazoMeses: { type: integer }
        creadoEn: { type: string, format: date-time }
      required: [id, solicitanteId, estado, score, banda, creadoEn]

    CasoRevision:
      type: object
      description: >
        Una evaluación que las políticas dejaron en revisión manual (RF-DEC-03). Nunca es
        un rechazo automático: rechazar o aprobar lo decide una persona.
      properties:
        evaluacionId: { type: string, format: uuid }
        solicitanteId: { type: string, format: uuid }
        documento: { type: string, description: "Documento del titular; la consola lo enmascara según el rol" }
        creadoEn: { type: string, format: date-time }
        score: { type: integer }
        banda: { type: string, enum: [A, B, C, D, E] }
        motivo:
          type: string
          enum: [REVISION_MANUAL, SOLICITAR_DATOS]
          description: Decisión de las políticas que dejó el caso en la bandeja
        resultadoParcial: { type: boolean, description: "Una fuente no respondió (resultado PARCIAL)" }
        razones:
          type: array
          items: { type: string }
          description: Razones del score, de mayor a menor impacto
        montoSolicitado: { type: string, description: "Decimal como string" }
        plazoMeses: { type: integer }
        proposito: { type: string }
      required: [evaluacionId, solicitanteId, documento, creadoEn, score, banda, motivo, resultadoParcial, razones]

    PaginaCasosRevision:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CasoRevision"
        total:
          type: integer
          format: int64
          description: Casos pendientes del tenant (para la paginación)
        productos:
          type: array
          description: >
            Productos activos del catálogo del tenant, los que se pueden elegir al aprobar.
            Van aquí porque ANALYST no puede leer /productos.
          items:
            $ref: "#/components/schemas/Producto"
      required: [items, total, productos]

    ResolucionNueva:
      type: object
      properties:
        decision: { type: string, enum: [APROBADO, RECHAZADO] }
        productoId:
          type: string
          format: uuid
          description: Obligatorio al aprobar; se omite al rechazar
        justificacion:
          type: string
          minLength: 10
          maxLength: 1000
          description: Obligatoria. Sin ella la API responde 400 VALIDATION_ERROR (RFC 9457)
      required: [decision, justificacion]

    Resolucion:
      type: object
      properties:
        evaluacionId: { type: string, format: uuid }
        decision: { type: string, enum: [APROBADO, RECHAZADO] }
        productoId: { type: string, format: uuid }
        justificacion: { type: string }
        resueltoPor: { type: string, description: "Usuario que resolvió (claim preferred_username)" }
        resueltoEn: { type: string, format: date-time }
      required: [evaluacionId, decision, justificacion, resueltoPor, resueltoEn]

    PaginaEvaluaciones:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluacionResumen"
        total:
          type: integer
          format: int64
          description: Total de evaluaciones que cumplen el filtro (para la paginación)
      required: [items, total]

    Producto:
      type: object
      description: Producto de crédito del catálogo del tenant.
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [MICROCREDITO, VERDE, PYME] }
        moneda: { type: string, enum: [BOB, USD] }
        montoMinimo: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", description: "Decimal como string" }
        montoMaximo: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", description: "Decimal como string" }
        plazoMinimoMeses: { type: integer, minimum: 1 }
        plazoMaximoMeses: { type: integer, minimum: 1 }
        tasaAnual: { type: string, description: "Porcentaje anual como string, p. ej. \"11.50\"" }
        bandaMinima: { type: string, enum: [A, B, C, D, E] }
        activo: { type: boolean }
      required: [id, tipo, moneda, montoMinimo, montoMaximo, plazoMinimoMeses, plazoMaximoMeses, tasaAnual, bandaMinima, activo]

    ProductoCambios:
      type: object
      description: Lo que el administrador del tenant puede cambiar de un producto (la tasa y la banda no).
      properties:
        activo: { type: boolean }
        montoMinimo: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        montoMaximo: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        plazoMinimoMeses: { type: integer, minimum: 1, maximum: 360 }
        plazoMaximoMeses: { type: integer, minimum: 1, maximum: 360 }
      required: [activo, montoMinimo, montoMaximo, plazoMinimoMeses, plazoMaximoMeses]

    Politica:
      type: object
      description: >
        Regla de decisión. Las reglas son fijas (el editor está fuera de alcance);
        el tenant solo las activa o pausa. Ninguna rechaza.
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, description: "Identificador estable de la regla" }
        nombre: { type: string }
        condicion: { type: string, description: "Condición legible, p. ej. \"score ≥ 650\"" }
        resultado: { type: string, enum: [PREAPROBADO, REVISION_MANUAL, SOLICITAR_DATOS] }
        activa: { type: boolean }
      required: [id, codigo, nombre, condicion, resultado, activa]

    PoliticaCambio:
      type: object
      properties:
        activa: { type: boolean }
      required: [activa]

    CodigoPlan:
      type: string
      enum: [FREE, PRO, ENTERPRISE]

    PeriodoPlan:
      type: object
      description: Mes calendario en UTC, el mismo con el que se cuenta la cuota.
      properties:
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time, description: "Exclusivo: inicio del mes siguiente" }
      required: [inicio, fin]

    EstadoPlan:
      type: object
      description: RF-PLN-04 / RF-PLN-05. Plan vigente hoy y los cambios en curso.
      properties:
        plan: { $ref: "#/components/schemas/CodigoPlan" }
        periodo: { $ref: "#/components/schemas/PeriodoPlan" }
        bajadaProgramada:
          $ref: "#/components/schemas/BajadaPlan"
          description: Ausente si no hay una bajada programada
        gracia:
          $ref: "#/components/schemas/GraciaPlan"
          description: Ausente si no hay una gracia vigente
      required: [plan, periodo]

    BajadaPlanNueva:
      type: object
      properties:
        planDestino:
          $ref: "#/components/schemas/CodigoPlan"
          description: Debe ser inferior al plan actual (si no, 409 PLAN_CHANGE_NOT_ALLOWED)
      required: [planDestino]

    BajadaPlan:
      type: object
      description: Bajada que se aplicará al cierre del período.
      properties:
        planDestino: { $ref: "#/components/schemas/CodigoPlan" }
        efectivaEn: { type: string, format: date-time, description: "Igual a periodo.fin" }
        integracionesADesactivar:
          type: array
          description: Integraciones activas hoy que excederán el plan destino; vacío si ninguna
          items: { $ref: "#/components/schemas/FuenteIntegracion" }
        solicitadaPor: { type: string, description: "Usuario que la programó (claim preferred_username)" }
        solicitadaEn: { type: string, format: date-time }
      required: [planDestino, efectivaEn, integracionesADesactivar, solicitadaPor, solicitadaEn]

    GraciaPlan:
      type: object
      description: >
        30 días después de una bajada. Lo que excede el plan nuevo queda desactivado, no
        borrado; al terminar se aplican los límites y la retención del plan nuevo.
      properties:
        planAnterior: { $ref: "#/components/schemas/CodigoPlan" }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time, description: "desde + 30 días; antes de esta fecha no se purga nada" }
        integracionesDesactivadas:
          type: array
          items: { $ref: "#/components/schemas/FuenteIntegracion" }
      required: [planAnterior, desde, hasta, integracionesDesactivadas]

    ReporteAccesos:
      type: object
      description: RF-CON-03. Una página del reporte, sin datos personales.
      properties:
        solicitanteId: { type: string, format: uuid, description: "Filtro aplicado, si se indicó" }
        correlationId: { type: string, description: "Filtro aplicado, si se indicó" }
        generadoEn: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegistroAcceso"
        autorizaciones:
          type: array
          description: Los consentimientos que aparecen en `items`, una vez cada uno
          items:
            $ref: "#/components/schemas/AutorizacionAcceso"
        siguienteCursor:
          type: integer
          format: int64
          description: Ausente si no hay más páginas
      required: [generadoEn, items, autorizaciones]

    RegistroAcceso:
      description: Un registro de la bitácora, con el titular afectado y la autorización usada.
      allOf:
        - $ref: "#/components/schemas/RegistroAuditoria"
        - type: object
          properties:
            solicitanteId:
              type: string
              format: uuid
              description: Titular cuyos datos se tocaron; ausente si la acción no toca datos de un titular
            consentimientoId:
              type: string
              format: uuid
              description: >
                Consentimiento con el que se hizo la acción; ausente si no lo requiere (por
                ejemplo, leer un perfil ya consolidado)

    AutorizacionAcceso:
      type: object
      description: Resumen de un consentimiento, sin el documento del titular.
      properties:
        consentimientoId: { type: string, format: uuid }
        solicitanteId: { type: string, format: uuid }
        fuentes:
          type: array
          items: { type: string, enum: [BURO, BANCO, WALLET] }
        finalidad: { type: string }
        estado: { type: string, enum: [ACTIVO, REVOCADO, EXPIRADO] }
        creadoEn: { type: string, format: date-time }
        expiraEn: { type: string, format: date-time }
        revocadoEn: { type: string, format: date-time, description: Solo si estado es REVOCADO }
      required: [consentimientoId, solicitanteId, fuentes, finalidad, estado, creadoEn, expiraEn]

    Recomendacion:
      type: object
      description: Un producto recomendado. Es una recomendación, no una aprobación.
      properties:
        tipoProducto: { type: string, enum: [MICROCREDITO, VERDE, PYME] }
        moneda: { type: string, enum: [BOB, USD] }
        montoSugerido: { type: string, description: "Decimal como string: monto ajustado a la capacidad de pago y al rango del producto" }
        razon: { type: string, description: "Por qué aplica, en lenguaje legible" }
        plazoSugeridoMeses:
          type: integer
          minimum: 1
          maximum: 360
          description: "RF-REC-03: plazo dentro del rango del producto. Opcional para snapshots anteriores a E-16."
        razones:
          type: array
          minItems: 2
          items: { type: string, minLength: 1 }
          description: "RF-REC-03: al menos dos razones del ajuste. Opcional para snapshots anteriores a E-16; razon se conserva por compatibilidad."
      required: [tipoProducto, moneda, montoSugerido, razon]

    ElegibilidadProducto:
      type: object
      description: Producto activo al evaluar, con los criterios del snapshot. Una recomendación no implica aprobación.
      properties:
        productoId: { type: string, format: uuid }
        tipoProducto: { type: string, enum: [MICROCREDITO, VERDE, PYME] }
        moneda: { type: string, enum: [BOB, USD] }
        elegible: { type: boolean }
        criterios:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CriterioElegibilidad"
      required: [productoId, tipoProducto, moneda, elegible, criterios]

    CriterioElegibilidad:
      type: object
      properties:
        codigo:
          type: string
          enum: [BANDA_MINIMA, RANGO_MONTO, RANGO_PLAZO, TIPO_TITULAR, DESTINO, CAPACIDAD_PAGO]
        cumple: { type: boolean }
        detalle: { type: string, minLength: 1 }
      required: [codigo, cumple, detalle]
